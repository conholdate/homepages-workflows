name: Metrics Refresh

on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:
    inputs:
      agent_ref:
        description: Branch, tag, or SHA in conholdate/homepages-agent
        required: false
        default: main
      deploy_production:
        description: Dispatch production deploys after a main metrics commit
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: metrics-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh baked metrics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'schedule' || vars.METRICS_REFRESH_CRON_ENABLED == 'true' }}

    env:
      HOMEPAGES_AGENT_MANAGED_SCOPE: aspose
      HOMEPAGES_AGENT_TARGET_REPO: ${{ github.workspace }}/homepages
      GITHUB_HOMEPAGES_REPOS_PAT: ${{ secrets.HOMEPAGES_SOURCE_PAT }}
      HOMEPAGES_SOURCE_PAT: ${{ secrets.HOMEPAGES_SOURCE_PAT }}
      HOMEPAGES_QA_SOURCE_REF: qa-homepages-v1

    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows
          persist-credentials: false

      - name: Checkout homepages-agent
        uses: actions/checkout@v4
        with:
          repository: conholdate/homepages-agent
          ref: ${{ github.event.inputs.agent_ref || 'main' }}
          token: ${{ secrets.HOMEPAGES_SOURCE_PAT }}
          path: homepages-agent
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout homepages source
        uses: actions/checkout@v4
        with:
          repository: conholdate/homepages
          ref: qa-homepages-v1
          token: ${{ secrets.HOMEPAGES_SOURCE_PAT }}
          path: homepages
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Homepages Agent
        working-directory: homepages-agent
        run: python -m pip install -e .

      - name: Refresh and commit metrics
        id: refresh
        shell: bash
        env:
          GIT_AUTHOR_NAME: Homepages Agent
          GIT_AUTHOR_EMAIL: homepages.agent@conholdate.com
          GIT_COMMITTER_NAME: Homepages Agent
          GIT_COMMITTER_EMAIL: homepages.agent@conholdate.com
        run: |
          set -euo pipefail

          if [ -z "${HOMEPAGES_SOURCE_PAT:-}" ]; then
            echo "::error::Missing HOMEPAGES_SOURCE_PAT"
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "${HOMEPAGES_SOURCE_PAT}" | base64 -w0)"
          homepages_repo="${GITHUB_WORKSPACE}/homepages"
          workflows_repo="${GITHUB_WORKSPACE}/workflows"
          agent_repo="${GITHUB_WORKSPACE}/homepages-agent"

          refresh_branch() {
            local branch="$1"
            local changed_var="$2"

            cd "${homepages_repo}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            git checkout -B "${branch}" "origin/${branch}"
            git reset --hard "origin/${branch}"
            git clean -fd -- data/metrics

            (cd "${agent_repo}" && python -m homepages_agent --homepages-repo "${homepages_repo}" metrics-bake --site all --apply --write)
            (cd "${agent_repo}" && python -m homepages_agent --homepages-repo "${homepages_repo}" metrics-validate --site all --write)

            git add data/metrics/*.json
            "${workflows_repo}/.github/scripts/metrics-refresh-scope-guard.sh"

            if git diff --cached --quiet; then
              printf '%s=false\n' "${changed_var}" >> "${GITHUB_OUTPUT}"
              echo "No metrics changes for ${branch}."
              return
            fi

            git commit \
              -m "Refresh baked metrics (scheduled)" \
              -m "Co-authored-by: salmansarfraz <kh.salman.sarfraz@gmail.com>" \
              -m "Co-authored-by: Codex <codex@openai.com>" \
              -m "Co-authored-by: Homepages Agent <homepages.agent@conholdate.com>"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push origin "HEAD:${branch}"
            printf '%s=true\n' "${changed_var}" >> "${GITHUB_OUTPUT}"
          }

          cd "${agent_repo}"
          refresh_branch "${HOMEPAGES_QA_SOURCE_REF}" qa_changed
          refresh_branch main main_changed

      - name: Dispatch production homepage deploys
        if: ${{ steps.refresh.outputs.main_changed == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.deploy_production) || (github.event_name == 'schedule' && vars.METRICS_REFRESH_PRODUCTION_DEPLOY_ENABLED == 'true')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sites=(aspose.com aspose.cloud aspose.app aspose.ai aspose.net aspose.org)
          for site in "${sites[@]}"; do
            payload="$(jq -n --arg ref "main" --arg site "${site}" '{ref:$ref,inputs:{site:$site,environment:"production",ref:"main",deploy:"true",invalidate_cache:"true"}}')"
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-homepage.yml/dispatches" \
              -d "${payload}" >/dev/null
            echo "Dispatched production deploy for ${site} at main."
          done

      - name: Metrics refresh summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Metrics Refresh"
            echo
            echo "- QA branch changed: ${{ steps.refresh.outputs.qa_changed || 'not reached' }}"
            echo "- Main branch changed: ${{ steps.refresh.outputs.main_changed || 'not reached' }}"
            echo "- Production deploy requested: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production || vars.METRICS_REFRESH_PRODUCTION_DEPLOY_ENABLED == 'true' }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
