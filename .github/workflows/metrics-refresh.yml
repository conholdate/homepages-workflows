name: Metrics Refresh

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      agent_ref:
        description: Branch, tag, or SHA in conholdate/homepages-agent
        required: false
        default: main
      deploy_production:
        description: Dispatch production deploys after a main metrics commit
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: metrics-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh baked metrics
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: ${{ github.event_name != 'schedule' || vars.METRICS_REFRESH_CRON_ENABLED == 'true' }}

    env:
      HOMEPAGES_AGENT_MANAGED_SCOPE: aspose
      HOMEPAGES_AGENT_TARGET_REPO: ${{ github.workspace }}/homepages
      GITHUB_HOMEPAGES_REPOS_PAT: ${{ secrets.HOMEPAGES_SOURCE_PAT }}
      HOMEPAGES_SOURCE_PAT: ${{ secrets.HOMEPAGES_SOURCE_PAT }}
      HOMEPAGES_QA_SOURCE_REF: qa-homepages-v1

    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows
          persist-credentials: false

      - name: Checkout homepages-agent
        uses: actions/checkout@v4
        with:
          repository: conholdate/homepages-agent
          ref: ${{ github.event.inputs.agent_ref || 'main' }}
          token: ${{ secrets.HOMEPAGES_SOURCE_PAT }}
          path: homepages-agent
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout homepages source
        uses: actions/checkout@v4
        with:
          repository: conholdate/homepages
          ref: qa-homepages-v1
          token: ${{ secrets.HOMEPAGES_SOURCE_PAT }}
          path: homepages
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Homepages Agent
        working-directory: homepages-agent
        run: python -m pip install -e .

      - name: Refresh and commit metrics
        id: refresh
        shell: bash
        env:
          GIT_AUTHOR_NAME: Homepages Agent
          GIT_AUTHOR_EMAIL: homepages.agent@conholdate.com
          GIT_COMMITTER_NAME: Homepages Agent
          GIT_COMMITTER_EMAIL: homepages.agent@conholdate.com
          REFRESH_MAIN: ${{ (github.event_name == 'schedule' && vars.METRICS_REFRESH_PRODUCTION_DEPLOY_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_production) }}
        run: |
          set -euo pipefail

          if [ -z "${HOMEPAGES_SOURCE_PAT:-}" ]; then
            echo "::error::Missing HOMEPAGES_SOURCE_PAT"
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "${HOMEPAGES_SOURCE_PAT}" | base64 -w0)"
          homepages_repo="${GITHUB_WORKSPACE}/homepages"
          workflows_repo="${GITHUB_WORKSPACE}/workflows"
          agent_repo="${GITHUB_WORKSPACE}/homepages-agent"

          refresh_branch() {
            local branch="$1"
            local changed_var="$2"
            local sha_var="$3"
            local sites_var="$4"
            local failed_var="$5"

            cd "${homepages_repo}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            git checkout -B "${branch}" "origin/${branch}"
            git reset --hard "origin/${branch}"
            git clean -fd -- data/metrics data/products.json

            (cd "${agent_repo}" && python -m homepages_agent --homepages-repo "${homepages_repo}" products-catalog-sync --apply --write)
            set +e
            (cd "${agent_repo}" && python -m homepages_agent --homepages-repo "${homepages_repo}" metrics-bake --site all --apply --skip-source-label-sync --write)
            bake_exit=$?
            set -e

            metrics_report="${agent_repo}/reports/latest-metrics-bake.json"
            successful_sites="$(python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print(" ".join(item["site"] for item in data if item.get("ok") and item.get("applied")))' "${metrics_report}")"
            failed_sites="$(python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print(" ".join(item["site"] for item in data if not item.get("ok")))' "${metrics_report}")"
            if [ -z "${successful_sites}" ]; then
              echo "::error::No site produced verified metrics; metrics-bake exit=${bake_exit}"
              exit 1
            fi
            if [ -n "${failed_sites}" ]; then
              echo "::warning::Metrics endpoints remained unavailable after bounded retries for: ${failed_sites}. Their last verified files are preserved."
            fi
            for site in ${successful_sites}; do
              (cd "${agent_repo}" && python -m homepages_agent --homepages-repo "${homepages_repo}" metrics-validate --site "${site}" --write)
            done
            printf '%s=%s\n' "${sites_var}" "${successful_sites}" >> "${GITHUB_OUTPUT}"
            printf '%s=%s\n' "${failed_var}" "${failed_sites}" >> "${GITHUB_OUTPUT}"

            git add data/products.json data/metrics/*.json
            "${workflows_repo}/.github/scripts/metrics-refresh-scope-guard.sh"

            if git diff --cached --quiet; then
              printf '%s=false\n' "${changed_var}" >> "${GITHUB_OUTPUT}"
              printf '%s=%s\n' "${sha_var}" "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
              echo "No metrics changes for ${branch}."
              return
            fi

            git commit \
              -m "Refresh baked metrics (scheduled)" \
              -m "Co-authored-by: salmansarfraz <kh.salman.sarfraz@gmail.com>" \
              -m "Co-authored-by: Codex <codex@openai.com>" \
              -m "Co-authored-by: Homepages Agent <homepages.agent@conholdate.com>"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push origin "HEAD:${branch}"
            printf '%s=true\n' "${changed_var}" >> "${GITHUB_OUTPUT}"
            printf '%s=%s\n' "${sha_var}" "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          }

          cd "${agent_repo}"
          refresh_branch "${HOMEPAGES_QA_SOURCE_REF}" qa_changed qa_sha qa_sites qa_failed_sites
          if [ "${REFRESH_MAIN}" = "true" ]; then
            refresh_branch main main_changed main_sha main_sites main_failed_sites
          else
            current_main_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
              ls-remote https://github.com/conholdate/homepages.git refs/heads/main | awk '{print $1}')"
            if [[ ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve the current homepages main commit"
              exit 1
            fi
            printf 'main_changed=false\n' >> "${GITHUB_OUTPUT}"
            printf 'main_sha=%s\n' "${current_main_sha}" >> "${GITHUB_OUTPUT}"
            printf 'main_sites=\n' >> "${GITHUB_OUTPUT}"
            printf 'main_failed_sites=\n' >> "${GITHUB_OUTPUT}"
            echo "Manual QA-only refresh left homepages main unchanged at ${current_main_sha}."
          fi

      - name: Synchronize QA homepage deployments
        if: ${{ always() && steps.refresh.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.refresh.outputs.qa_sha }}
          SITES: ${{ steps.refresh.outputs.qa_sites }}
        run: |
          set -euo pipefail
          read -r -a sites <<< "${SITES}"
          if [ "${#sites[@]}" -eq 0 ]; then
            echo "::error::No successfully refreshed QA sites were reported"
            exit 1
          fi

          if [ -z "${HOMEPAGES_SOURCE_PAT:-}" ]; then
            echo "::error::Missing HOMEPAGES_SOURCE_PAT"
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "${HOMEPAGES_SOURCE_PAT}" | base64 -w0)"
          remote_qa_sha() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
              ls-remote https://github.com/conholdate/homepages.git "refs/heads/${HOMEPAGES_QA_SOURCE_REF}" | awk '{print $1}'
          }
          public_qa_matches() {
            local site="$1"
            local cache_key="$2"
            public_qa_matches_sha "${site}" "${SOURCE_SHA}" "${cache_key}"
          }
          public_qa_matches_sha() {
            local site="$1"
            local expected_sha="$2"
            local cache_key="$3"
            local identity
            identity="$(curl -fsS --compressed --max-time 20 \
              "https://qa.${site}/.well-known/homepages-deployment.json?metrics-refresh=${cache_key}" || true)"
            [ "$(jq -r '.source_sha // ""' <<<"${identity}" 2>/dev/null || true)" = "${expected_sha}" ] && \
              [ "$(jq -r '.site // ""' <<<"${identity}" 2>/dev/null || true)" = "${site}" ] && \
              [ "$(jq -r '.environment // ""' <<<"${identity}" 2>/dev/null || true)" = "qa" ]
          }
          public_qa_source() {
            local site="$1"
            local cache_key="$2"
            curl -fsS --compressed --max-time 20 \
              "https://qa.${site}/.well-known/homepages-deployment.json?metrics-refresh=${cache_key}" 2>/dev/null | \
              jq -r '.source_sha // ""' 2>/dev/null || true
          }
          public_qa_has_noindex() {
            local site="$1"
            local cache_key="$2"
            local html
            html="$(curl -fsS --compressed --max-time 20 \
              "https://qa.${site}/?metrics-refresh=${cache_key}" || true)"
            grep -Eiq '<meta[^>]*name="?robots"?[^>]*content="?[^>]*noindex' <<<"${html}"
          }

          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Metrics QA source is not an exact commit SHA: ${SOURCE_SHA}"
            exit 1
          fi

          remote_qa="$(remote_qa_sha)"
          if [ "${remote_qa}" != "${SOURCE_SHA}" ]; then
            echo "::error::Homepages QA ref drifted before metrics deploy: expected ${SOURCE_SHA}, found ${remote_qa}"
            exit 1
          fi

          candidate_heads="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            ls-remote --heads https://github.com/conholdate/homepages.git \
            'refs/heads/homepages-agent/qa-changes/*')"
          declare -A run_ids
          declare -A preserved_candidates
          for site in "${sites[@]}"; do
            if public_qa_matches "${site}" "${GITHUB_RUN_ID}-before-${site//./-}"; then
              echo "QA ${site} already serves ${SOURCE_SHA}; no deploy needed."
              continue
            fi

            current_qa_sha="$(public_qa_source "${site}" "${GITHUB_RUN_ID}-candidate-${site//./-}")"
            candidate_ref="$(awk -v expected="${current_qa_sha}" '$1 == expected { print $2; exit }' <<<"${candidate_heads}")"
            if [ -n "${candidate_ref}" ]; then
              preserved_candidates["${site}"]="${current_qa_sha}"
              echo "QA ${site} is reviewing active candidate ${candidate_ref} at ${current_qa_sha}; preserving it instead of replacing it with the metrics branch."
              continue
            fi

            transaction_id="metrics-refresh-${GITHUB_RUN_ID}-qa-${site//./-}"
            gh workflow run deploy-homepage.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref main \
              -f "site=${site}" \
              -f "environment=qa" \
              -f "ref=${SOURCE_SHA}" \
              -f "deploy=true" \
              -f "invalidate_cache=true" \
              -f "transaction_id=${transaction_id}"

            run_id=""
            for _ in $(seq 1 30); do
              runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-homepage.yml/runs?event=workflow_dispatch&per_page=100")"
              run_id="$(jq -r --arg marker "tx=${transaction_id}" '.workflow_runs | map(select(.display_title | contains($marker))) | sort_by(.created_at) | last | .id // empty' <<<"${runs_json}")"
              [ -n "${run_id}" ] && break
              sleep 2
            done
            if [ -z "${run_id}" ]; then
              echo "::error::Could not discover QA deploy run for ${site} (${transaction_id})"
              exit 1
            fi
            run_ids["${site}"]="${run_id}"
            echo "Dispatched ${site} QA deploy run ${run_id} at ${SOURCE_SHA}."
          done

          for site in "${sites[@]}"; do
            preserved_sha="${preserved_candidates[$site]:-}"
            if [ -n "${preserved_sha}" ]; then
              if ! public_qa_matches_sha "${site}" "${preserved_sha}" "${GITHUB_RUN_ID}-preserved-${site//./-}"; then
                echo "::error::Active QA candidate changed while metrics refresh was preserving ${site}: expected ${preserved_sha}"
                exit 1
              fi
              if ! public_qa_has_noindex "${site}" "${GITHUB_RUN_ID}-preserved-noindex-${site//./-}"; then
                echo "::error::Preserved active QA candidate is missing robots noindex for ${site} at ${preserved_sha}"
                exit 1
              fi
              echo "Verified preserved active QA candidate for ${site} at ${preserved_sha}."
              continue
            fi

            run_id="${run_ids[$site]:-}"
            if [ -n "${run_id}" ]; then
              completed=false
              for _ in $(seq 1 180); do
                run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
                status="$(jq -r '.status' <<<"${run_json}")"
                conclusion="$(jq -r '.conclusion // ""' <<<"${run_json}")"
                if [ "${status}" = "completed" ]; then
                  if [ "${conclusion}" != "success" ]; then
                    echo "::error::QA deploy run ${run_id} for ${site} completed as ${conclusion}"
                    exit 1
                  fi
                  completed=true
                  break
                fi
                sleep 10
              done
              if [ "${completed}" != "true" ]; then
                echo "::error::Timed out waiting for QA deploy run ${run_id} for ${site}"
                exit 1
              fi
            fi

            verified=false
            for attempt in $(seq 1 60); do
              if public_qa_matches "${site}" "${GITHUB_RUN_ID}-after-${site//./-}-${attempt}"; then
                verified=true
                break
              fi
              sleep 10
            done
            if [ "${verified}" != "true" ]; then
              echo "::error::Public QA deployment identity did not converge for ${site} at ${SOURCE_SHA}"
              exit 1
            fi
            if ! public_qa_has_noindex "${site}" "${GITHUB_RUN_ID}-noindex-${site//./-}"; then
              echo "::error::Public QA root is missing robots noindex for ${site} at ${SOURCE_SHA}"
              exit 1
            fi
            echo "Verified ${site} QA identity at ${SOURCE_SHA}${run_id:+ (run ${run_id})}."
          done

          remote_qa_after="$(remote_qa_sha)"
          if [ "${remote_qa_after}" != "${SOURCE_SHA}" ]; then
            echo "::error::Homepages QA ref changed during metrics deploy: expected ${SOURCE_SHA}, found ${remote_qa_after}"
            exit 1
          fi

      - name: Dispatch production homepage deploys
        if: ${{ steps.refresh.outputs.main_changed == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.deploy_production) || (github.event_name == 'schedule' && vars.METRICS_REFRESH_PRODUCTION_DEPLOY_ENABLED == 'true')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.refresh.outputs.main_sha }}
          SITES: ${{ steps.refresh.outputs.main_sites }}
        run: |
          set -euo pipefail
          read -r -a sites <<< "${SITES}"
          if [ "${#sites[@]}" -eq 0 ]; then
            echo "::error::No successfully refreshed production sites were reported"
            exit 1
          fi

          if [ -z "${HOMEPAGES_SOURCE_PAT:-}" ]; then
            echo "::error::Missing HOMEPAGES_SOURCE_PAT"
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "${HOMEPAGES_SOURCE_PAT}" | base64 -w0)"
          remote_main_sha() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
              ls-remote https://github.com/conholdate/homepages.git refs/heads/main | awk '{print $1}'
          }

          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Metrics production source is not an exact commit SHA: ${SOURCE_SHA}"
            exit 1
          fi

          remote_main="$(remote_main_sha)"
          if [ "${remote_main}" != "${SOURCE_SHA}" ]; then
            echo "::error::Homepages main drifted before metrics deploy: expected ${SOURCE_SHA}, found ${remote_main}"
            exit 1
          fi

          declare -A run_ids
          for site in "${sites[@]}"; do
            transaction_id="metrics-refresh-${GITHUB_RUN_ID}-${site//./-}"
            gh workflow run deploy-homepage.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref main \
              -f "site=${site}" \
              -f "environment=production" \
              -f "ref=${SOURCE_SHA}" \
              -f "deploy=true" \
              -f "invalidate_cache=true" \
              -f "transaction_id=${transaction_id}"

            run_id=""
            for _ in $(seq 1 30); do
              runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-homepage.yml/runs?event=workflow_dispatch&per_page=100")"
              run_id="$(jq -r --arg marker "tx=${transaction_id}" '.workflow_runs | map(select(.display_title | contains($marker))) | sort_by(.created_at) | last | .id // empty' <<<"${runs_json}")"
              [ -n "${run_id}" ] && break
              sleep 2
            done
            if [ -z "${run_id}" ]; then
              echo "::error::Could not discover production deploy run for ${site} (${transaction_id})"
              exit 1
            fi
            run_ids["${site}"]="${run_id}"
            echo "Dispatched ${site} production deploy run ${run_id} at ${SOURCE_SHA}."
          done

          for site in "${sites[@]}"; do
            run_id="${run_ids[$site]}"
            completed=false
            for _ in $(seq 1 180); do
              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              status="$(jq -r '.status' <<<"${run_json}")"
              conclusion="$(jq -r '.conclusion // ""' <<<"${run_json}")"
              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" != "success" ]; then
                  echo "::error::Production deploy run ${run_id} for ${site} completed as ${conclusion}"
                  exit 1
                fi
                completed=true
                break
              fi
              sleep 10
            done
            if [ "${completed}" != "true" ]; then
              echo "::error::Timed out waiting for production deploy run ${run_id} for ${site}"
              exit 1
            fi

            verified=false
            identity_url="https://www.${site}/.well-known/homepages-deployment.json"
            for attempt in $(seq 1 60); do
              identity="$(curl -fsS --compressed --max-time 20 "${identity_url}?metrics-refresh=${GITHUB_RUN_ID}-${attempt}" || true)"
              actual_sha="$(jq -r '.source_sha // ""' <<<"${identity}" 2>/dev/null || true)"
              actual_site="$(jq -r '.site // ""' <<<"${identity}" 2>/dev/null || true)"
              actual_environment="$(jq -r '.environment // ""' <<<"${identity}" 2>/dev/null || true)"
              if [ "${actual_sha}" = "${SOURCE_SHA}" ] && [ "${actual_site}" = "${site}" ] && [ "${actual_environment}" = "production" ]; then
                verified=true
                break
              fi
              sleep 10
            done
            if [ "${verified}" != "true" ]; then
              echo "::error::Public deployment identity did not converge for ${site} at ${SOURCE_SHA}"
              exit 1
            fi
            echo "Verified ${site} production identity at ${SOURCE_SHA} (run ${run_id})."
          done

          remote_main_after="$(remote_main_sha)"
          if [ "${remote_main_after}" != "${SOURCE_SHA}" ]; then
            echo "::error::Homepages main changed during metrics deploy: expected ${SOURCE_SHA}, found ${remote_main_after}"
            exit 1
          fi

      - name: Metrics refresh summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Metrics Refresh"
            echo
            echo "- QA branch changed: ${{ steps.refresh.outputs.qa_changed || 'not reached' }}"
            echo "- QA source synchronized: ${{ steps.refresh.outputs.qa_sha || 'not reached' }}"
            echo "- QA sites refreshed: ${{ steps.refresh.outputs.qa_sites || 'none' }}"
            echo "- QA sites preserving last value: ${{ steps.refresh.outputs.qa_failed_sites || 'none' }}"
            echo "- Main branch changed: ${{ steps.refresh.outputs.main_changed || 'not reached' }}"
            echo "- Production sites refreshed: ${{ steps.refresh.outputs.main_sites || 'none' }}"
            echo "- Production sites preserving last value: ${{ steps.refresh.outputs.main_failed_sites || 'none' }}"
            echo "- Production deploy requested: ${{ steps.refresh.outputs.main_changed == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.deploy_production) || (github.event_name == 'schedule' && vars.METRICS_REFRESH_PRODUCTION_DEPLOY_ENABLED == 'true')) }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
